# Global agent configuration

# Router configuration (lightweight routing)
router:
  model: "claude-haiku"
  max_tokens: 4096

# Planner configuration (complex orchestration)
planner:
  model: "claude-opus"
  max_tokens: 32768
  max_tool_calls: 20
  max_pause_continuations: 5
  web_search: # Server-side web search/fetch for planner.
    max_uses: 5
    max_content_tokens: 10000
    # Content from these domains steers the agent that edits workflows.
    allowed_domains:
      - hl7.org
      - docs.openfn.org
