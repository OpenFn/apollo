# Global agent configuration

# Router configuration (lightweight routing)
router:
  model: "claude-haiku"
  max_tokens: 500
  temperature: 0.0

# Planner configuration (complex orchestration)
planner:
  model: "claude-opus"
  max_tokens: 24576
  max_tool_calls: 10
  web_search: # Server-side web search/fetch for planner.
    max_uses: 5
    max_content_tokens: 10000
    allowed_domains:
      - docs.dhis2.org
      - docs.openfn.org
