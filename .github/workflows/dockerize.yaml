name: Build and push Docker images

on:
  push:
    tags: "@openfn/apollo@**"

jobs:
  build-and-push-worker-image:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read version from tag
        id: extract
        run: |
          GIT_TAG=${GITHUB_REF#refs/tags/}
          echo Git Tag: $GIT_TAG

          VERSION=${GIT_TAG#@openfn/apollo@}
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Can't read a version from tag $GIT_TAG"
            exit 1
          fi
          echo Version: $VERSION

          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # type=semver gives the bare version tag (no "v") and the standard OCI
      # labels. It only moves :latest for a final release, so a pre-release
      # (e.g. 1.4.0-pre.0) never repoints latest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openfn/apollo
          tags: |
            type=semver,pattern={{version}},value=${{ steps.extract.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
