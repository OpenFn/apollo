name: Unit tests

# Runs when a pull request is created or its head is updated
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
on: pull_request

jobs:
  unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==2.3.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Run unit tests
        run: poetry run pytest services/*/tests/unit

  unicode-parity:
    name: Unicode parity with Elixir
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `services/name_rules.py` carries tables generated from the Elixir that
    # Lightning runs: grapheme break classes, Extended_Pictographic, combining
    # classes, the trim set and OTP's NFC. If Elixir's or Python's Unicode
    # version moves and nobody re-runs the harness, the tables silently stop
    # matching and Apollo starts emitting step names Lightning rejects. This
    # job is the only thing that would notice.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.3"
          otp-version: "27"

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate range edges from the tables
        working-directory: tools/unicode_parity
        run: python3 edges.py

      - name: Probe Elixir
        working-directory: tools/unicode_parity
        run: elixir probe.exs

      - name: Compare against name_rules
        working-directory: tools/unicode_parity
        run: python3 check.py

  bun:
    name: Bun unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apollo
          POSTGRES_PASSWORD: apollo
          POSTGRES_DB: apollo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgres://apollo:apollo@localhost:5432/apollo_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Poetry
        run: pipx install poetry==2.3.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Run unit tests
        run: bun test
